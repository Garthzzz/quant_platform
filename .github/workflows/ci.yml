name: exact-sha-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quant-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: quant_hub/pyproject.toml
      - name: Install runtime and test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "setuptools==80.10.2" -e ./quant_hub pytest
      - name: Verify public Git boundary
        shell: pwsh
        run: python -B tools/release/git_guard.py gate --scope tracked
      - name: Run public-safe unit tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $testPackageRoot = Join-Path $workspace "quant_hub"
          $sourceRoot = Join-Path $testPackageRoot "src"
          $env:PYTHONPATH = [string]::Join(
            [System.IO.Path]::PathSeparator,
            @($workspace, $testPackageRoot, $sourceRoot)
          )
          $unittestArgs = @(
            "-B", "-m", "unittest",
            "tests.test_git_guard",
            "tests.test_legacy_browser_baseline",
            "tests.test_ids_config",
            "tests.test_migrations",
            "tests.test_objects",
            "tests.test_comment_store",
            "tests.test_comment_anchor_projection",
            "tests.test_web_security",
            "tests.test_release_inventory",
            "tests.test_release_builder",
            "tests.test_release_identity",
            "tests.test_sqlite_checkpoint",
            "tests.test_checkpoint_cli",
            "tests.test_state_only_backup",
            "tests.test_stage_closure",
            "tests.test_failure_domain",
            "tests.test_failure_domain_cli",
            "tests.test_failure_domain_rotation",
            "tests.test_production_host_facts_cli",
            "tests.test_vm_boundary",
            "tests.test_vm_bootstrap_cli",
            "tests.test_recovery_bundle",
            "tests.test_cold_bundle_cli",
            "tests.test_cold_restore_cli",
            "tests.test_deployment_controller",
            "tests.test_publish_cli",
            "tests.test_publish_adapters",
            "tests.test_publish_runtime",
            "tests.test_operational_source_cli",
            "tests.test_vm_deploy_cli",
            "tests.test_windows_service",
            "tests.test_writer_handoff",
            "tests.test_writer_handoff_client",
            "tests.test_knowledge_reference_compiler",
            "tests.test_knowledge_semantic",
            "tests.test_knowledge_semantic_partition_provider",
            "tests.test_knowledge_semantic_cli",
            "tests.test_semantic_authority",
            "tests.test_knowledge_retrieval_eval",
            "tests.test_knowledge_public_quality",
            "tests.test_knowledge_release_build",
            "tests.test_knowledge_citation_projection",
            "tests.test_knowledge_mcp",
            "tests.test_knowledge_mcp_stress_public",
            "tests.test_ds_review_harness",
            "tests.test_ds_review_external_v3",
            "tests.test_generic_research_renderer",
            "-v"
          )
          $unitLog = Join-Path $env:RUNNER_TEMP "qrh-public-unittest.log"
          $PSNativeCommandUseErrorActionPreference = $false
          & python @unittestArgs *> $unitLog
          $unitExit = $LASTEXITCODE
          if ($unitExit -ne 0) {
            $failureIdentifiers = @(
              Select-String -LiteralPath $unitLog -Pattern '(?<identifier>(?:FAIL|ERROR): [A-Za-z0-9_.]+ \([A-Za-z0-9_.]+\))' |
                ForEach-Object { $_.Matches[0].Groups['identifier'].Value } |
                Sort-Object -Unique
            )
            $exceptionTypes = @(
              Select-String -LiteralPath $unitLog -Pattern '(?<exception>[A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):' |
                ForEach-Object { $_.Matches[0].Groups['exception'].Value } |
                Sort-Object -Unique
            )
            $missingModules = @(
              Select-String -LiteralPath $unitLog -Pattern "ModuleNotFoundError: No module named '(?<module>[A-Za-z_][A-Za-z0-9_.]*)'" |
                ForEach-Object { $_.Matches[0].Groups['module'].Value } |
                Sort-Object -Unique
            )
            [System.IO.File]::Delete($unitLog)
            if ($failureIdentifiers.Count -eq 0) {
              Write-Output "::error title=Public unit test failure::unittest exited $unitExit without a structured FAIL/ERROR identifier"
            }
            else {
              foreach ($identifier in $failureIdentifiers | Select-Object -First 20) {
                $message = $identifier.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Public unit test failure::$message"
              }
            }
            foreach ($exceptionType in $exceptionTypes | Select-Object -First 20) {
              Write-Output "::error title=Public unit test exception type::$exceptionType"
            }
            foreach ($missingModule in $missingModules | Select-Object -First 20) {
              Write-Output "::error title=Missing public Python module::$missingModule"
            }
            exit $unitExit
          }
          [System.IO.File]::Delete($unitLog)
          Write-Output "Public-safe unit tests passed"
      - name: Build and exercise installable operational wheel
        shell: pwsh
        run: |
          $wheelRoot = Join-Path $env:RUNNER_TEMP "qrh-wheel"
          New-Item -ItemType Directory -Path $wheelRoot -Force | Out-Null
          $privateNames = @(
            "archive_presentation.json",
            "citation_projection_overrides.json",
            "evidence_zh_overlays.json",
            "research_supplements.json"
          )
          $privatePaths = @(
            $privateNames | ForEach-Object {
              Join-Path $PWD ("quant_hub\src\quant_hub\presentation\" + $_)
            }
          )
          $privateSupplementRoot = Join-Path $PWD "quant_hub\src\quant_hub\presentation\supplements"
          $privateSupplement = Join-Path $privateSupplementRoot "ci-private-presentation-sentinel.md"
          if (Test-Path -LiteralPath $privateSupplementRoot) {
            throw "Public checkout unexpectedly contains private presentation supplements"
          }
          foreach ($privatePath in $privatePaths) {
            if (Test-Path -LiteralPath $privatePath) {
              throw "Public checkout unexpectedly contains private presentation business data"
            }
          }
          $sentinel = [System.Text.UTF8Encoding]::new($false).GetBytes(
            '{"schema_version":"qrh-private-citation-ci-sentinel/v1"}'
          )
          try {
            New-Item -ItemType Directory -Path $privateSupplementRoot | Out-Null
            foreach ($privatePath in $privatePaths) {
              [System.IO.File]::WriteAllBytes($privatePath, $sentinel)
            }
            [System.IO.File]::WriteAllBytes($privateSupplement, $sentinel)
            python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir $wheelRoot ./quant_hub
            if ($LASTEXITCODE -ne 0) {
              throw "wheel build failed"
            }
          }
          finally {
            if (Test-Path -LiteralPath $privateSupplement) {
              Remove-Item -LiteralPath $privateSupplement -Force
            }
            if (Test-Path -LiteralPath $privateSupplementRoot) {
              Remove-Item -LiteralPath $privateSupplementRoot -Force
            }
            foreach ($privatePath in $privatePaths) {
              if (Test-Path -LiteralPath $privatePath) {
                Remove-Item -LiteralPath $privatePath -Force
              }
            }
          }
          foreach ($privatePath in $privatePaths) {
            if (Test-Path -LiteralPath $privatePath) {
              throw "private presentation CI sentinel cleanup failed"
            }
          }
          if (Test-Path -LiteralPath $privateSupplementRoot) {
            throw "private presentation supplement CI sentinel cleanup failed"
          }
          $wheels = @(Get-ChildItem -LiteralPath $wheelRoot -Filter *.whl)
          if ($wheels.Count -ne 1) {
            throw "wheel build must produce exactly one artifact"
          }
          $wheel = $wheels[0].FullName
          $entries = @(tar -tf $wheel)
          if ($entries -notcontains "quant_hub/knowledge_mcp/server.py") {
            throw "wheel is missing the stdio MCP server"
          }
          if ($entries -notcontains "quant_hub/knowledge_mcp/evaluation.py") {
            throw "wheel is missing the MCP trace evaluator"
          }
          if ($entries -notcontains "quant_hub/knowledge_mcp/acceptance_runner.py") {
            throw "wheel is missing the fake-only MCP acceptance runner"
          }
          if ($entries -notcontains "quant_hub/knowledge/semantic_cli.py") {
            throw "wheel is missing the semantic operator CLI"
          }
          if ($entries -notcontains "quant_hub/knowledge/ds_review.py") {
            throw "wheel is missing the zero-network DS review harness"
          }
          if ($entries -notcontains "quant_hub/knowledge/ds_review_external_v3.py") {
            throw "wheel is missing the fake-only external DS review v3 contract"
          }
          if ($entries -notcontains "quant_hub/knowledge/citations.py") {
            throw "wheel is missing the Evidence citation projection module"
          }
          foreach ($privateName in $privateNames) {
            if ($entries -contains ("quant_hub/presentation/" + $privateName)) {
              throw "public wheel must not contain ignored presentation business data"
            }
          }
          if ($entries -contains "quant_hub/presentation/supplements/ci-private-presentation-sentinel.md") {
            throw "public wheel must not contain ignored presentation supplements"
          }
          if ($entries -notcontains "quant_hub/generic_research/release.py") {
            throw "wheel is missing the finalized generic release loader"
          }
          if ($entries -notcontains "quant_hub/generic_research/templates/generic_research/document.html") {
            throw "wheel is missing the generic research template"
          }
          if ($entries -notcontains "quant_hub/generic_research/static/generic-comments.js") {
            throw "wheel is missing the generic comment client"
          }
          if ($entries -notcontains "quant_hub/ops/operational_source_cli.py") {
            throw "wheel is missing the fixed operational source CLI"
          }
          if ($entries -notcontains "quant_hub/ops/production_host_facts_cli.py") {
            throw "wheel is missing the fixed production host facts CLI"
          }
          if ($entries -notcontains "quant_hub/ops/state_only_backup.py") {
            throw "wheel is missing the state-only recovery job"
          }
          if ($entries -notcontains "quant_hub/ops/stage_closure.py") {
            throw "wheel is missing the Stage 5/6 closure verifier"
          }
          if ($entries -notcontains "quant_hub/ops/failure_domain_authority.py") {
            throw "wheel is missing the failure-domain authority gate"
          }
          if ($entries -notcontains "quant_hub/ops/failure_domain_rotation.py") {
            throw "wheel is missing the failure-domain rotation diagnostics"
          }
          if ($entries -notcontains "quant_hub/ops/writer_handoff.py") {
            throw "wheel is missing the fixed C-to-D writer handoff"
          }
          if ($entries -notcontains "quant_hub/ops/writer_handoff_client.py") {
            throw "wheel is missing the off-host writer handoff client"
          }
          if ($entries -notcontains "quant_hub/ops/semantic_authority.py") {
            throw "wheel is missing the semantic authority operator"
          }
          $entryPointPath = @($entries | Where-Object { $_ -like "*.dist-info/entry_points.txt" })
          if ($entryPointPath.Count -ne 1) {
            throw "wheel must contain exactly one entry_points.txt"
          }
          $entryPoints = tar -xOf $wheel $entryPointPath[0]
          if (($entryPoints -join "`n") -notmatch "qrh-knowledge-mcp = quant_hub\.knowledge_mcp\.cli:main") {
            throw "wheel is missing the qrh-knowledge-mcp entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-knowledge-compile = quant_hub\.knowledge\.semantic_cli:main") {
            throw "wheel is missing the qrh-knowledge-compile entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-publish = quant_hub\.ops\.publish:main") {
            throw "wheel is missing the qrh-publish entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-cold-bundle = quant_hub\.ops\.cold_bundle_cli:main") {
            throw "wheel is missing the qrh-cold-bundle entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-cold-restore = quant_hub\.ops\.cold_restore_cli:main") {
            throw "wheel is missing the qrh-cold-restore entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-operational-source = quant_hub\.ops\.operational_source_cli:main") {
            throw "wheel is missing the qrh-operational-source entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-production-host-facts = quant_hub\.ops\.production_host_facts_cli:main") {
            throw "wheel is missing the qrh-production-host-facts entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-failure-domain = quant_hub\.ops\.failure_domain_rotation:main") {
            throw "wheel is missing the qrh-failure-domain entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-state-only-backup = quant_hub\.ops\.state_only_backup:main") {
            throw "wheel is missing the qrh-state-only-backup entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-writer-handoff = quant_hub\.ops\.writer_handoff:main") {
            throw "wheel is missing the qrh-writer-handoff entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-writer-handoff-client = quant_hub\.ops\.writer_handoff_client:main") {
            throw "wheel is missing the qrh-writer-handoff-client entrypoint"
          }
          if (($entryPoints -join "`n") -notmatch "qrh-semantic-authority = quant_hub\.ops\.semantic_authority:main") {
            throw "wheel is missing the qrh-semantic-authority entrypoint"
          }
          # Metadata presence is not sufficient: install the exact built wheel
          # outside the checkout import path and execute both module and console
          # boundaries used by the one-time writer handoff.  --help is strictly
          # read-only and still proves the packaged import graph/entrypoint bind.
          $venvRoot = Join-Path $env:RUNNER_TEMP "qrh-wheel-smoke"
          python -m venv --system-site-packages $venvRoot
          $venvPython = Join-Path $venvRoot "Scripts\python.exe"
          $venvPip = Join-Path $venvRoot "Scripts\pip.exe"
          & $venvPip install --disable-pip-version-check --no-deps $wheel
          if ($LASTEXITCODE -ne 0) {
            throw "exact wheel installation failed"
          }
          & $venvPython -I -B -c "import quant_hub.knowledge.citations"
          if ($LASTEXITCODE -ne 0) {
            throw "wheel citation projection import smoke failed"
          }
          foreach ($module in @(
            "quant_hub.ops.writer_handoff",
            "quant_hub.ops.writer_handoff_client"
          )) {
            & $venvPython -I -B -m $module --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "wheel module smoke failed: $module"
            }
          }
          foreach ($entrypoint in @(
            "qrh-writer-handoff.exe",
            "qrh-writer-handoff-client.exe"
          )) {
            $command = Join-Path $venvRoot "Scripts\$entrypoint"
            if (-not (Test-Path -LiteralPath $command -PathType Leaf)) {
              throw "wheel console entrypoint is unavailable: $entrypoint"
            }
            & $command --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "wheel console entrypoint smoke failed: $entrypoint"
            }
          }
      - name: Validate OpenSpec
        shell: pwsh
        run: |
          npm install --global @fission-ai/openspec@latest
          openspec validate design-vm-knowledge-mcp --strict --no-interactive
          openspec validate enable-ds-public-synthetic-advisory-review-v3 --strict --no-interactive
          openspec validate --all --strict --no-interactive
