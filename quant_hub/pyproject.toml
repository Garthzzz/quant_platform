[build-system]
requires = ["setuptools>=75"]
build-backend = "quant_hub_build_backend"
backend-path = ["."]

[project]
name = "quant-research-hub"
version = "0.1.0"
description = "Archive-first 量化研究知识与工程平台"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "bleach>=6.3,<7",
  "flask>=3.1,<4",
  "latex2mathml>=3.81,<4",
  "markdown-it-py>=4.0,<5",
  "pymupdf>=1.27,<2",
  "pydantic>=2.12,<3",
  "pywin32>=311; sys_platform == 'win32'",
  "typer>=0.20,<1",
]

[project.scripts]
qrh = "quant_hub.cli:app"
paper-lab-scan = "quant_hub.paper_lab.compat:scan_main"
paper-lab-run = "quant_hub.paper_lab.compat:run_main"
paper-lab-write = "quant_hub.paper_lab.compat:write_main"
paper-lab-query = "quant_hub.paper_lab.compat:query_main"
paper-lab-components = "quant_hub.paper_lab.compat:component_main"
paper-lab-import = "quant_hub.paper_lab.compat:legacy_import_main"
paper-lab-viewer = "quant_hub.paper_lab.compat:viewer_main"
qrh-publish = "quant_hub.ops.publish:main"
qrh-writer-handoff = "quant_hub.ops.writer_handoff:main"
qrh-vm-bootstrap = "quant_hub.ops.vm_bootstrap_cli:main"
qrh-tooling-update = "quant_hub.ops.tooling_update_host:main"
qrh-knowledge-mcp = "quant_hub.knowledge_mcp.cli:main"
qrh-knowledge-compile = "quant_hub.knowledge.semantic_cli:main"
qrh-semantic-authority = "quant_hub.ops.semantic_authority:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_hub.web" = ["templates/*.html", "static/*.css", "static/*.js"]
"quant_hub.generic_research" = [
  "templates/generic_research/*.html",
  "static/*.css",
  "static/*.js",
]
"quant_hub.evidence" = [
  "templates/evidence/*.html",
  "static/*.css",
]
"quant_hub.paper_lab" = [
  "schemas/*.json",
  "templates/paper_lab/*.html",
  "static/*.css",
  "static/*.js",
]
[tool.setuptools.exclude-package-data]
# Reviewed citation mappings are sealed production business data.  They may be
# present in a developer or release-materialization tree, but a Public wheel
# must never inherit them through the broad presentation JSON pattern above.
"quant_hub.presentation" = [
  "archive_presentation.json",
  "citation_projection_overrides.json",
  "evidence_zh_overlays.json",
  "research_supplements.json",
]

[tool.setuptools.data-files]
"migrations/platform" = ["migrations/platform/*.sql"]
"migrations/archive" = ["migrations/archive/*.sql"]
"migrations/research_papers" = ["migrations/research_papers/*.sql"]
"migrations/paper_lab" = ["migrations/paper_lab/*.sql"]
"paper_lab/pipeline" = ["paper_lab/pipeline/*.py"]
"paper_lab/tools" = ["paper_lab/tools/*.py"]
"paper_lab/tools/viewer" = ["paper_lab/tools/viewer/*.py"]
